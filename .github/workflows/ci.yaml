name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Test application
        run: npm ci && npm test

      - name: Build candidate image
        run: docker build --tag incident-lab:${{ github.sha }} .

      - name: Scan filesystem and Kubernetes configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: incident-lab:${{ github.sha }}
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
