name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-delivery-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.36.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Ansible validation dependency
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate scripts, manifests, Helm values, Terraform, and Ansible
        run: bash scripts/validate-config.sh

  test-build-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Test application
        run: npm ci && npm test

      - name: Build candidate image
        run: docker build --tag incident-lab:${{ github.sha }} .

      - name: Verify minimal non-root runtime
        run: |
          docker run --rm --entrypoint sh incident-lab:${{ github.sha }} -ec '
            node --version
            test "$(id -u)" = "10001"
            ! command -v npm
            ! command -v npx
            ! command -v corepack
            ! command -v yarn
          '

      - name: Scan filesystem and Kubernetes configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: incident-lab:${{ github.sha }}
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
