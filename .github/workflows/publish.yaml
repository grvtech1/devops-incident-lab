name: Publish and propose GitOps promotion

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.names.outputs.image_name }}
      image_tag: ${{ steps.names.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Test application
        run: npm ci && npm test

      - name: Derive immutable image name
        id: names
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.image_name }}:${{ steps.names.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image_name }}:${{ steps.names.outputs.image_tag }}
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image_name }}:${{ steps.names.outputs.image_tag }}
          version: v0.72.0
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

  propose-gitops-change:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update production image declaration
        env:
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="gitops/promote-${GITHUB_SHA::7}"
          git switch --create "$branch"
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" k8s/overlays/production/kustomization.yaml
          sed -i "s|digest: .*|digest: ${IMAGE_DIGEST}|" k8s/overlays/production/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore(gitops): promote ${IMAGE_TAG}"
          git push --force-with-lease origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(gitops): promote ${IMAGE_TAG}" \
            --body "Promotes immutable image ${IMAGE_NAME}@${IMAGE_DIGEST} (source tag ${IMAGE_TAG}). Merge after reviewing CI, scan, and SBOM evidence."
