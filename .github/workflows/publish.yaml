name: Publish and propose GitOps promotion

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.names.outputs.image_name }}
      image_tag: ${{ steps.names.outputs.image_tag }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Test application
        run: npm ci && npm test

      - name: Derive image coordinates
        id: names
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build source-qualified candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.names.outputs.image_name }}:${{ steps.names.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan candidate image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image_name }}:${{ steps.names.outputs.image_tag }}
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image_name }}:${{ steps.names.outputs.image_tag }}
          version: v0.72.0
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push approved candidate image
        id: push
        env:
          IMAGE_REF: ${{ steps.names.outputs.image_name }}:${{ steps.names.outputs.image_tag }}
        shell: bash
        run: |
          docker push "$IMAGE_REF" 2>&1 | tee /tmp/docker-push.log
          digest=$(sed -n 's/^.*digest: \(sha256:[a-f0-9]\{64\}\).*$/\1/p' /tmp/docker-push.log | tail -1)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  propose-gitops-change:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.36.2

      - name: Update production image declaration
        env:
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="gitops/promote-${GITHUB_SHA::7}"
          git switch --create "$branch"
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" k8s/overlays/production/kustomization.yaml
          sed -i "s|digest: .*|digest: ${IMAGE_DIGEST}|" k8s/overlays/production/kustomization.yaml
          rendered_manifest="$(kubectl kustomize k8s/overlays/production)"
          grep -Fq "image: ${IMAGE_NAME}@${IMAGE_DIGEST}" <<< "$rendered_manifest"
          if git diff --quiet -- k8s/overlays/production/kustomization.yaml; then
            echo "Production already references ${IMAGE_NAME}@${IMAGE_DIGEST}; no promotion is required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore(gitops): promote ${IMAGE_TAG}"
          git push --force-with-lease origin "$branch"
          pr_url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(gitops): promote ${IMAGE_TAG}" \
              --body "Promotes immutable digest ${IMAGE_NAME}@${IMAGE_DIGEST} (source tag ${IMAGE_TAG}). A dedicated CI run is dispatched against this branch; merge only after it passes and after reviewing scan and SBOM evidence.")"
          fi
          echo "Promotion PR: ${pr_url}"
          gh workflow run ci.yaml --ref "$branch"
