---
- name: Prepare every Kubernetes node
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove swap entries from fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(.+\s+swap\s+.+)$'
        replace: '# \1'

    - name: Load required kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load required kernel modules now
      ansible.builtin.command: "modprobe {{ item }}"
      changed_when: false
      loop: [overlay, br_netfilter]

    - name: Configure Kubernetes networking sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      notify: Reload sysctl

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gpg]
        state: present
        update_cache: true

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Docker repository key for containerd
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate containerd default configuration
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml
      notify: Restart containerd

    - name: Use systemd cgroups in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Install Kubernetes repository key
      ansible.builtin.shell: >-
        curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key
        | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Configure Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install Kubernetes node packages
      ansible.builtin.apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system

    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true

- name: Initialize the control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Initialize kubeadm
      ansible.builtin.command: >-
        kubeadm init
        --apiserver-advertise-address={{ private_ip }}
        --pod-network-cidr={{ pod_network_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create administrator kubeconfig directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Install administrator kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Install Calico API definitions
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: >-
        kubectl apply -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/v1_crd_projectcalico_org.yaml
      changed_when: true

    - name: Install Calico operator
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: >-
        kubectl apply -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
      changed_when: true

    - name: Install Calico custom resources
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: >-
        kubectl apply -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/custom-resources.yaml
      changed_when: true

    - name: Generate a time-limited worker join command
      ansible.builtin.command: kubeadm token create --ttl 30m --print-join-command
      register: kubeadm_join
      changed_when: false

    - name: Save join command for worker play
      ansible.builtin.set_fact:
        worker_join_command: "{{ kubeadm_join.stdout }}"

- name: Join worker nodes
  hosts: workers
  become: true
  serial: 1
  tasks:
    - name: Join the Kubernetes cluster
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].worker_join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
