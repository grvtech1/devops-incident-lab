apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: incident-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: ConfigMap
      name: incident-lab-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: production
      - op: replace
        path: /data/CHAOS_ENABLED
        value: "false"
images:
  - name: incident-lab-image
    newName: ghcr.io/REPLACE_OWNER/devops-incident-lab
    digest: sha256:REPLACE_DIGEST
