apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incident-lab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: incident-lab
  source:
    repoURL: REPLACE_REPO_URL
    targetRevision: main
    path: REPLACE_GITOPS_PATH
  destination:
    server: https://kubernetes.default.svc
    namespace: incident-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
